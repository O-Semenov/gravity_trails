<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Trails: Soft-Body Climber</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f0f12 0%, #15151c 100%);
            color: #ffffff;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #loading {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 0.5px;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Ebitengine canvas container */
        #canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* Style the canvas created by Ebitengine */
        canvas {
            display: block;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            max-width: 100vw;
            max-height: 100vh;
            outline: none;
        }
    </style>
    <script src="wasm_exec.js"></script>
    <script>
        // Polyfill for older browsers
        if (!WebAssembly.instantiateStreaming) {
            WebAssembly.instantiateStreaming = async (resp, importObject) => {
                const source = await (await resp).arrayBuffer();
                return await WebAssembly.instantiate(source, importObject);
            };
        }

        const go = new Go();
        
        // Load and run the WASM file
        WebAssembly.instantiateStreaming(fetch("game.wasm"), go.importObject).then((result) => {
            const loading = document.getElementById("loading");
            if (loading) {
                loading.style.opacity = 0;
                setTimeout(() => loading.remove(), 500);
            }
            go.run(result.instance);
        }).catch((err) => {
            console.error("Ошибка запуска игры:", err);
            const status = document.getElementById("status-text");
            const spinner = document.querySelector(".spinner");
            if (spinner) spinner.style.display = "none";
            if (status) {
                status.innerHTML = `<span style="color: #ef4444;">Ошибка загрузки игры</span><br><small style="font-size: 14px; color: #a1a1aa; display: block; margin-top: 8px;">${err.message || err}</small>`;
            }
        });
    </script>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div id="status-text">Загрузка Gravity Trails...</div>
    </div>
    <!-- Ebitengine automatically binds or appends canvas here if none is present -->
</body>
</html>
